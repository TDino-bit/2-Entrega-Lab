{% extends 'base.html' %}

{% block content %}
    <h2>Confirmar Exclusão</h2>
    <p>Você tem certeza que deseja excluir o post "<strong>{{ post.title }}</strong>"?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sim, quero excluir</button>
    </form>
    <br>
    <a href="{% url 'post_detail' pk=post.pk %}">Cancelar</a>
{% endblock %}
