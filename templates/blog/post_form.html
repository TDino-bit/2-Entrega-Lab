{% extends 'base.html' %}

{% block content %}
    <h2>{% if post %}Editar{% else %}Novo{% endif %} Post</h2>
    
    <form method="POST">
        {% csrf_token %}
        <label for="title">Título:</label><br>
        <input type="text" name="title" id="title" value="{{ post.title }}"><br><br>
        
        <label for="content">Conteúdo (HTML aceito):</label><br>
        <textarea name="content" id="content" rows="10" cols="50">{{ post.content }}</textarea><br><br>
        
        <button type="submit">Salvar</button>
    </form>
    <br>
    <a href="{% url 'post_list' %}">Cancelar</a>
{% endblock %}
