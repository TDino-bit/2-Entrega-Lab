{% extends 'base.html' %}

{% block content %}
    <h2>Adicionar Comentário em: "{{ post.title }}"</h2>
    
    <form method="POST">
        {% csrf_token %}
        <label for="text">Seu comentário:</label><br>
        <textarea name="text" id="text" rows="5" cols="50" required></textarea><br><br>
        
        <button type="submit">Enviar Comentário</button>
    </form>
    <br>
    <a href="{% url 'post_detail' pk=post.pk %}">Cancelar e Voltar</a>
{% endblock %}
